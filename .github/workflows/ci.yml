name: CI Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  # Detect changed paths to scope quality checks
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            scripts:
              - 'scripts/**'

  lint-and-typecheck:
    name: Lint & Type-Check (scripts)
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi
      - name: Ruff (lint)
        run: ruff check scripts/
      - name: Mypy (type-check)
        run: mypy scripts/
      - name: Pytest (unit tests)
        run: pytest scripts/ -q || true

  security-audit:
    name: Security Audit (scripts)
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r scripts/requirements.txt 2>/dev/null || pip-audit 2>/dev/null || true

  build-artifact:
    name: Build Plugin Zip Artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create plugin zip
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          ZIP_NAME="mylaprak-plugin-${VERSION}.zip"
          zip -r "${ZIP_NAME}" skills/ plugin.json README.md CONTRIBUTING.md -x "*.git*"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mylaprak-plugin
          path: "mylaprak-plugin-*.zip"
          retention-days: 7
