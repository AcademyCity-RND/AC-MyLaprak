# ==============================================================================
# GIT-CLIFF CONFIG — MyLaprak
# ==============================================================================
# Auto versioning + auto changelog dari Conventional Commits.
# Tool: git-cliff (https://github.com/orhun/git-cliff)
# Format output: Keep a Changelog (https://keepachangelog.com/id/1.0.0/)
# Versi: SemVer (https://semver.org/lang/id/)
#
# Install (CI): taiki-e/install-action@git-cliff
# Lokal:        cargo install git-cliff  |  scoop install git-cliff
# ==============================================================================

[changelog]
header = """# CHANGELOG — MyLaprak

Semua perubahan signifikan didokumentasikan di sini. File ini di-generate otomatis
oleh [git-cliff](https://github.com/orhun/git-cliff) dari Conventional Commits.
Format mengikuti [Keep a Changelog](https://keepachangelog.com/id/1.0.0/),
versi mengikuti [SemVer](https://semver.org/lang/id/).

---
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  # Catatan: `filter_unconventional = true` di atas membuang commit non-conventional
  # sebelum parser jalan. Catch-all `.*` di bawah berfungsi sebagai safety-net untuk
  # commit CONVENTIONAL dengan type belum terdaftar (mis. style:, revert:) — bukan untuk
  # commit non-conventional (sudah terfilter). Urutan penting: skip/release sebelum group.
  { message = "^feat", group = "✨ Baru" },
  { message = "^fix", group = "🛠️ Diperbaiki" },
  { message = "^perf", group = "⚡ Performa" },
  { message = "^docs", group = "📝 Dokumentasi" },
  { message = "^test", group = "✅ Test" },
  { message = "^refactor", group = "♻️ Refactor" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore|^ci|^build", group = "📦 Internal" },
  { message = ".*", group = "🔒 Lainnya" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "v0.0.0"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
